services:
  - type: web
    name: smart1-client-action-center
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 180 --max-requests 250 --max-requests-jitter 25 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AUTO_GMAIL_SYNC_MINUTES
        value: "15"
      - key: GMAIL_SYNC_QUERY
        value: "newer_than:30d -in:sent -in:drafts -in:spam -in:trash -category:promotions -category:social -category:forums"
      - key: GMAIL_SCAN_MAX_MESSAGES
        value: "500"
      - key: GMAIL_ANALYZE_MAX_NEW
        value: "40"
      - key: OPENAI_EMAIL_BODY_CHARS
        value: "8000"
      - key: EMAIL_RESEARCH_MAX_MESSAGES
        value: "500"
      - key: EMAIL_DISCOVERY_MAX_MESSAGES
        value: "100"
      - key: EMAIL_DISCOVERY_LOOKBACK_DAYS
        value: "0"
      - key: SENT_MONITOR_LOOKBACK_DAYS
        value: "30"
      - key: SENT_FOLLOWUP_AFTER_DAYS
        value: "3"
      - key: SENT_SCAN_MAX_MESSAGES
        value: "200"
      - key: CHAT_SYNC_LOOKBACK_DAYS
        value: "30"
      - key: CHAT_SCAN_MAX_SPACES
        value: "100"
      - key: CHAT_SCAN_MAX_MESSAGES_PER_SPACE
        value: "75"
      - key: WATCH_DOMAIN_LOOKBACK_DAYS
        value: "90"
      - key: AI_CONTEXT_CHAR_BUDGET
        value: "60000"
    disk:
      name: smart1-action-data
      mountPath: /var/data
      sizeGB: 1
